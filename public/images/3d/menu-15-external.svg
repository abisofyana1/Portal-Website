<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad_m15" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>

    <!-- 3D Sphere / Prism Lighting Gradient -->
    <radialGradient id="sphereGrad_m15" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="85%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#050b14" />
    </radialGradient>

    <!-- Metallic Specular Highlight Gradient -->
    <linearGradient id="specular_m15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_m15" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for 3D elements -->
    <filter id="shadow_m15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Ambient background glow & rounded card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad_m15)" />
  <rect width="508" height="508" x="2" y="2" rx="98" fill="none" stroke="url(#specular_m15)" stroke-width="4" stroke-opacity="0.5" />

  <!-- 3D Pedestal / Floating Platform Shadow -->
  <ellipse cx="256" cy="420" rx="150" ry="32" fill="#000000" opacity="0.45" filter="url(#glow_m15)" />

  <!-- Floating 3D Orb / Main Capsule -->
  <g filter="url(#shadow_m15)">
    <circle cx="256" cy="245" r="140" fill="url(#sphereGrad_m15)" />
    <!-- Glass/Glossy Reflection Arch -->
    <path d="M 150 200 A 130 130 0 0 1 362 200 A 130 90 0 0 0 150 200 Z" fill="#ffffff" opacity="0.25" />
    <!-- Inner Rim Glow -->
    <circle cx="256" cy="245" r="138" fill="none" stroke="#5eead4" stroke-width="3" opacity="0.6" />
  </g>

  <!-- 3D Geometric Floating Rings / Accents -->
  <ellipse cx="256" cy="245" rx="175" ry="48" fill="none" stroke="#5eead4" stroke-width="6" opacity="0.75" transform="rotate(-25 256 245)" filter="url(#glow_m15)" />
  <ellipse cx="256" cy="245" rx="175" ry="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" transform="rotate(-25 256 245)" />

  <!-- Front 3D Icon Graphic -->
  <g filter="url(#shadow_m15)" transform="translate(146, 135) scale(0.44)">
    
      <rect x="90" y="140" width="280" height="280" rx="36" fill="#ffffff" />
      <path d="M260 90 L 420 90 L 420 250" fill="none" stroke="#2dd4bf" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="400" y1="110" x2="230" y2="280" stroke="#2dd4bf" stroke-width="44" stroke-linecap="round" />
      <rect x="140" y="190" width="180" height="180" rx="20" fill="#0f766e" />
    
  </g>

  <!-- Glossy Front Sphere Highlight -->
  <ellipse cx="210" cy="165" rx="42" ry="22" fill="#ffffff" opacity="0.6" transform="rotate(-30 210 165)" />

  <!-- Subtitle Tag / Badge on 3D Card -->
  <g transform="translate(256, 435)">
    <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#0f172a" opacity="0.8" stroke="#5eead4" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">EXTERNAL TOOLS</text>
  </g>
</svg>